distributable:
    github: machbase/neo-pkg-llm
    strip_components: 1

description: |
    LLM agent backend process package for machbase-neo.
    Provides LLM-based agent functionality with configurable backends.

platforms:
    - linux/amd64
    - linux/arm64
    - darwin/arm64
    - darwin/amd64
    - windows/amd64

build:
    scripts:
        - run: |
              set -ex
              go version
              go mod tidy
              mkdir -p dist dist/.backend
              go build -v -o dist/neo-pkg-llm .
              cp scripts/*.sh dist/.backend/
              cp .backend.yml dist/
              cp index.html dist/
              chmod +x dist/.backend/*.sh
        - on: windows
          run: |
              go version
              go mod tidy
              if not exist dist mkdir dist
              if not exist dist\.backend mkdir dist\.backend
              go build -v -o dist\neo-pkg-llm.exe .
              copy scripts\*.cmd dist\.backend\
              copy .backend.yml dist\
              copy index.html dist\
provides:
    - dist/
test:
    scripts:
        - run: |
              test -x dist/neo-pkg-llm
              test -f dist/.backend.yml
              test -f dist/index.html
              test -x dist/.backend/start.sh
              test -x dist/.backend/stop.sh
        - on: windows
          run: |
              dir dist\neo-pkg-llm.exe
              dir dist\.backend.yml
              dir dist\index.html
              dir dist\.backend\start.cmd
              dir dist\.backend\stop.cmd
install:
    scripts:
        - run: |
              echo "Installing neo-pkg-llm package..."
              chmod +x ./.backend/start.sh ./.backend/stop.sh
        - on: windows
          run: |
              echo "Installing neo-pkg-llm package for Windows..."
uninstall:
    scripts:
        - run: |
              echo "Uninstalling neo-pkg-llm package..."
        - on: windows
          run: |
              echo "Uninstalling neo-pkg-llm package for Windows..."
